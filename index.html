<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/styles.css" />

  <title>Frontend Mentor | Fylo data storage component</title>
</head>

<body>
  <main>
    <div class="grid-container">
      <section class="header grid-container__block">
        <img class="header__logo" src="./images/logo.svg" alt="Fylo Logo" aria-label="Fylo" />
        <div class="icons">
          <a class="icons__link" href="#">
            <img class="icons__image" src="./images/icon-document.svg" alt="An icon of a document" />
          </a>
          <a class="icons__link" href="#">
            <img class="icons__image" src="./images/icon-folder.svg" alt="An icon of a folder" />
          </a>
          <a class="icons__link" href="#">
            <img class="icons__image" src="./images/icon-upload.svg"
              alt="An icon of a cloud with an arrow inside, denoting upload" />
          </a>
        </div>
      </section>
      <section class="storage grid-container__block">
        <p class="storage__text">You’ve used 815 GB of your storage</p>
        <div class="storage__container progress-bar">
          <div class="progress-bar__color">
            <div class="progress-bar__dot"></div>
          </div>
        </div>
        <div class="storage__remaining">
          185 GB Left
        </div>
        <div class="storage__values">
          <p>0 GB</p>
          <p>1000 GB</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/Ankia-Fuls">Ankia Fuls</a>.
  </footer>

</body>

</html>
